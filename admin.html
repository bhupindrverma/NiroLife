<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NiroLife Growth Dashboard</title><link rel="stylesheet" href="styles.css"><style>body{background:#eef5f0}.admin{width:min(1180px,calc(100% - 32px));margin:45px auto}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.admin h1{font-family:'Playfair Display',serif;font-size:42px;margin:0}.login,.empty{background:#fff;padding:30px;border-radius:7px}.login{max-width:430px}.login input{width:100%;padding:12px;border:1px solid #d5e1db;border-radius:4px;margin:8px 0 14px}.cards{display:grid;gap:14px}.lead{background:#fff;padding:22px;border-radius:7px;border:1px solid #dce7e1;display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:18px}.lead h2{font-family:'DM Sans',sans-serif;font-size:18px;margin:0 0 5px}.lead p{font-size:12px;color:#657978;margin:4px 0}.badge{display:inline-block;background:#e8f5ed;color:#28716a;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700}.metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:25px 0 40px}.metric{background:#173b3a;color:#fff;padding:20px;border-radius:7px}.metric strong{display:block;font-size:28px}.metric span{font-size:11px;color:#b8d2ca}.section-title{font-family:'Playfair Display',serif;font-size:30px;margin:0 0 18px}@media(max-width:800px){.lead{grid-template-columns:1fr}.admin-head{display:block}.admin h1{font-size:34px}.metric-grid{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="admin"><div class="admin-head"><div><p class="eyebrow">Private dashboard</p><h1>NiroLife growth dashboard</h1></div><a href="/">View website</a></div><section class="login" id="login"><label>Admin password<input id="adminKey" type="password" autocomplete="current-password"></label><button class="button button-primary" id="loadButton">Open dashboard</button><p id="loginStatus"></p></section><section id="dashboard" hidden><div class="metric-grid" id="metrics"></div><h2 class="section-title">Publishing enquiries</h2><section class="cards" id="leadCards"></section></section></main><script src="admin.js"></script></body></html>
