<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NiroLife Customer Workflow</title><link rel="stylesheet" href="styles.css"><style>
body{background:#eef5f0;color:#173b3a}.admin{width:min(1240px,calc(100% - 32px));margin:38px auto 70px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.admin h1{font-family:'Playfair Display',serif;font-size:42px;margin:0}.admin-head nav{display:flex;gap:12px;align-items:center}.admin-head button,.admin-head a{font-size:13px}.login,.empty,.attention{background:#fff;padding:28px;border-radius:12px;border:1px solid #dce7e1}.login{max-width:430px}.login input{width:100%;padding:12px;border:1px solid #d5e1db;border-radius:7px;margin:8px 0 14px}.metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.metric{background:#173b3a;color:#fff;padding:19px;border-radius:10px}.metric strong{display:block;font-size:28px}.metric span{font-size:11px;color:#b8d2ca}.attention{margin:0 0 24px;border-left:5px solid #e9963e}.attention h2,.section-title{font-family:'Playfair Display',serif;margin:0 0 14px}.attention-list{display:grid;gap:8px}.attention-list a{display:flex;gap:15px;align-items:center;padding:11px 12px;background:#fff7ed;border-radius:8px;color:#173b3a;text-decoration:none}.attention-list span{font-size:12px;color:#6e6256}.all-clear{margin:0;color:#28716a}.board-tools{display:flex;align-items:center;justify-content:space-between;margin:24px 0 14px}.board-tools select{padding:10px;border:1px solid #cadbd3;border-radius:7px;background:#fff}.workflow-board{display:grid;gap:16px}.customer-card{background:#fff;border:1px solid #dce7e1;border-radius:12px;padding:22px}.customer-card.needs-attention{border-left:5px solid #e9963e}.customer-card header,.customer-card footer,.journey{display:flex;justify-content:space-between;gap:20px}.customer-card h2{font-size:21px;margin:6px 0 3px}.customer-card p{font-size:12px;color:#657978;margin:4px 0;white-space:pre-line}.customer-card time,.customer-card small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#718581}.owner{display:inline-block;border-radius:20px;padding:4px 8px;background:#e8f5ed;color:#28716a;font-size:10px;font-weight:800;text-transform:uppercase}.owner-admin{background:#fff0dd;color:#a65d13}.journey{background:#f3f8f5;border-radius:9px;padding:15px;margin:17px 0}.journey>div:first-child{min-width:220px}.journey small,.customer-grid small{display:block;margin-bottom:7px}.stage-select,.follow-up,.notes{width:100%;padding:10px;border:1px solid #cadbd3;border-radius:7px;background:#fff}.next-action{flex:1}.next-action strong{font-size:13px;line-height:1.5}.customer-grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:20px;margin:18px 0}.customer-grid a{display:block;font-size:12px;margin-top:5px}.customer-grid button{margin-top:7px}.notes-label{font-size:11px;font-weight:700}.notes{display:block;min-height:74px;margin-top:6px;resize:vertical}.customer-card footer{align-items:center;margin-top:12px}.preview-link{font-weight:700}.muted{font-size:11px;color:#83938f}@media(max-width:850px){.admin-head,.customer-card header,.customer-card footer,.journey{display:block}.admin h1{font-size:34px}.metric-grid{grid-template-columns:1fr 1fr}.customer-grid{grid-template-columns:1fr}.journey>div{margin-bottom:13px}.attention-list a{display:block}.board-tools{align-items:flex-start}.admin-head nav{margin-top:12px}}
</style></head><body><main class="admin"><div class="admin-head"><div><p class="eyebrow">Private operations</p><h1>Customer workflow</h1></div><nav><button id="refreshButton" class="button button-secondary">Refresh</button><a href="/">View website</a></nav></div><section class="login" id="login"><label>Admin password<input id="adminKey" type="password" autocomplete="current-password"></label><button class="button button-primary" id="loadButton">Open dashboard</button><p id="loginStatus"></p></section><section id="dashboard" hidden><div class="metric-grid" id="metrics"></div><section class="attention"><h2>Needs your attention</h2><div class="attention-list" id="attentionList"></div></section><div class="board-tools"><h2 class="section-title">Customer pipeline</h2><select id="stageFilter" aria-label="Filter by stage"><option value="all">All stages</option></select></div><section class="workflow-board" id="workflowBoard"></section></section></main><script src="admin.js"></script></body></html>
